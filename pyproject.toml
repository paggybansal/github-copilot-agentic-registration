[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-copilot-agentic-registration"
version = "0.1.0"
description = "A Flask registration feature delivered through a GitHub Copilot Agentic SDLC pipeline."
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4.0",
    "Flask-WTF>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "selenium>=4.20",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "ui: Selenium browser tests",
    "performance: wall-clock-sensitive performance tests",
]

[tool.coverage.run]
source = ["src/registration_app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]